name: helloWorld

on:
 push:
  branches: [ "main" ]
 pull_request:
  branches: [ "main" ]
 workflow_dispatch:
 
jobs:
 Logintodockerhub:
  runs-on: self-hosted
  environment: dev
  steps:
   - uses: actions/checkout@v3
   - name: docker login
     uses: docker/login-action@v2.1.0
     with:
      registry: registry-1.docker.io
      username: ${{secrets.DOCKERHUBUSERNAME}}
      password: ${{secrets.DOCKERHUBPASSWORD}}
 
 Logintodockerhub:
  runs-on: self-hosted
  environment: qa
  steps:
   - uses: actions/checkout@v3
   - name: docker login
     uses: docker/login-action@v2.1.0
     with:
      registry: registry-1.docker.io
      username: ${{secrets.DOCKERHUBUSERNAME}}
      password: ${{secrets.DOCKERHUBPASSWORD}
